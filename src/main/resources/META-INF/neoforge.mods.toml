    modId = "minecraft"
    type = "required"
    versionRange = "[1.21.1,1.22)"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.nekorogenerationscpufix]]
    modId = "generations_core"
    type = "required"
    versionRange = "[1.2,)"
    ordering = "AFTER"
    side = "BOTH"

[[mixins]]
