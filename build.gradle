plugins {
    id 'java-library'
    id 'net.neoforged.gradle.userdev' version '7.1.21'
}

version = project.mod_version
group = project.mod_group_id

base {
    archivesName = 'Nekoro-Generations-CPU-Fix'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

dependencies {
    // Generations-Core is not needed to compile: the mixin targets its class by name
    implementation "net.neoforged:neoforge:${neo_version}"
}

jar {
    archiveFileName = "Nekoro-GCF-${project.mod_version}-NeoForge-${project.mc_version}.jar"
    manifest {
        attributes([
            'Specification-Title'   : project.mod_id,
            'Specification-Vendor'  : 'Alolan Xardas',
            'Specification-Version' : '1',
            'Implementation-Title'  : project.name,
            'Implementation-Version': project.mod_version,
            'Implementation-Vendor' : 'Alolan Xardas'
        ])
    }
}
